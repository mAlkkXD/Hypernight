# Fuzzel — Mocha Rosita
# Lanzador centrado arriba, translúcido, con blur y borde rosa.
# Sin magenta: solo rosa suave, lavanda y ciruela.

[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=no
use-bold=yes

# Prompt con icono de búsqueda (Nerd Font) y texto de ayuda
prompt= 
placeholder=Buscar aplicación...

# Resultados: icono + nombre, sin previews gigantes
icons-enabled=yes
icon-theme=Tela-pink-dark
image-size-ratio=0
fields=name,generic,keywords,exec

# Comportamiento
match-mode=fuzzy
sort-result=yes
cache=/home/malkkxd/.cache/fuzzel
filter-desktop=no
list-executables-in-path=no
terminal=kitty -e {cmd}
enable-mouse=yes
exit-on-keyboard-focus-loss=yes
auto-select=no
hide-before-typing=no
match-counter=no
show-actions=no

# Geometría: arriba-centrado, ancho tipo palette, altura media
anchor=top
y-margin=40
width=57
lines=9
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=30
letter-spacing=0

# Capa y blur (la regla de Hyprland usa el namespace "fuzzel")
layer=overlay
namespace=fuzzel

[colors]
background=1b1620b3
text=f2e7f0ff
message=e9dde9ff
prompt=f5bde6ff
placeholder=a99aaecc
input=f5bde6ff
match=ffc4e8ff
selection=eeb0dce6
selection-text=241722ff
selection-match=9a3d78ff
counter=b9a8c0ff
border=f5bde6d9

[border]
width=2
radius=18
selection-radius=10

[dmenu]
mode=text
exit-immediately-if-empty=yes
