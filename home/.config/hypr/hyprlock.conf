# hyprlock — Mocha Rosita

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.95
    brightness = 0.6
    vibrancy = 0.2
}

# Reloj grande
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(245, 189, 230, 0.95)
    font_size = 110
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(184, 174, 198, 0.9)
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    inner_color = rgba(30, 27, 34, 0.75)
    outer_color = rgba(245, 189, 230, 0.9) rgba(203, 166, 247, 0.9) 45deg
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)

    font_color = rgba(232, 226, 238, 0.95)
    font_family = $font
    placeholder_text = <span foreground="#b8aec6">contraseña</span>
    fail_text = <span foreground="#f38ba8">falló, intenta de nuevo</span>

    rounding = 16
    fade_on_empty = false

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = usuario: $USER
    color = rgba(184, 174, 198, 0.75)
    font_size = 12
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}
